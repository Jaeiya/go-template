version: 2

builds:
  - id: "app_name"
    # Relative path to main.go
    main: ./cmd/app_name
    binary: app_name
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    gcflags:
      - "all=-B -l=120"
    ldflags:
      - -s -w
      - -X github.com/Jaeiya/koshime/internal.Version={{ .Version }}
      - -X github.com/Jaeiya/koshime/internal.CommitHash={{ .ShortCommit }}
      - -X github.com/Jaeiya/koshime/internal.BuildDate={{ .Date }}
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1

archives:
  - id: default
    format_overrides:
      - goos: windows
        formats:
           - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^tdd"
      - "^test"
  groups:
    - title: New
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 100

    - title: Changes
      regexp: "^.*upd[(\\w)]*:+.*$"
      order: 200

    - title: "Fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 300

    - title: "Docs"
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 400

    - title: "Cleaning"
      regexp: "^.*clean[(\\w)]*:+.*$"
      order: 500

    - title: "Maintenance"
      regexp: "^.*chore[(\\w)]*:+.*$"
      order: 600

    - title: "Other"
      order: 999
