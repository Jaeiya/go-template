version: 2

builds:
  - main: ./cmd/app_name # relative path to "main.go"
    binary: "app_name_{{ .Timestamp }}_{{ .Os }}"
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X main.version={{ .Version }}
      - -X main.commitSha={{ .ShortCommit }}
      - -X main.buildDate={{ .Date }}
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    no_unique_dist_dir: true

snapshot:
  version_template: "build-{{ .Timestamp }}"

checksum:
  disable: true

# Explicitly disable archive generation for dev workflows
archives:
  - formats:
      - binary
